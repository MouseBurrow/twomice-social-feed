[package]
name = "social-feed"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
axum = "0.7"
chrono = { version = "0.4.42", features = ["serde"] }
config = { path = "../../libs/config" }
custom_headers = { path = "../../libs/custom_headers" }
easy_errors = { path = "../../libs/easy_errors" }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0-alpha.1", default-features = false, features = ["postgres", "runtime-tokio", "macros", "uuid", "chrono", "migrate", "tls-rustls"] }
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros"] }
uuid = { version = "1.18.1", features = ["serde"] }
